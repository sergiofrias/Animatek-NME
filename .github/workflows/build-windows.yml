name: Build Animatek NME (Windows)

on:
  workflow_dispatch:

permissions:
  contents: write # Allows GitHub Actions to create the Release

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure CMake
        run: cmake -B build-win-release -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build-win-release --config Release

      - name: Package Executable
        run: |
          mkdir release-dist
          copy build-win-release\AnimatekNME_artefacts\Release\AnimatekNME.exe release-dist\
          powershell Compress-Archive -Path release-dist\* -DestinationPath AnimatekNME-Windows.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.22.0-windows # You can update this tag name whenever a new version drops
          name: "Animatek NME v0.22.0 (Windows Build)"
          generate_release_notes: true # Automatically generates release notes from commits!
          files: AnimatekNME-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
